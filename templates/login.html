<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Acesso protegido - Mota Business Suite</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="brand-badge">AM</div>
        <div>
          <h1>Mota Business Suite</h1>
          <p>Acesso protegido à rede local</p>
        </div>
      </div>

      <div class="login-security">
        <strong>🔐 Código temporário</strong>
        <p>
          Digite o código mostrado no computador que iniciou o sistema
          em modo rede.
        </p>
      </div>

      {% if erro %}
      <div class="login-error" role="alert">{{ erro }}</div>
      {% endif %}

      <form method="post" action="/login" autocomplete="off">
        <label for="codigo">Código de acesso</label>
        <input
          id="codigo"
          name="codigo"
          type="password"
          required
          autofocus
          maxlength="128"
          autocomplete="one-time-code"
          placeholder="Digite o código temporário"
        >
        <button class="primary full" type="submit">Entrar</button>
      </form>

      <p class="login-note">
        O código não é armazenado na URL nem no histórico do navegador.
      </p>
    </section>
  </main>
</body>
</html>
